name: Credential expiry alerts

on:
  schedule:
    - cron: '37 14 * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Intentionally fail once to test your GitHub failure notifications'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: credential-expiry-alerts
  cancel-in-progress: false

jobs:
  check-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check recorded expiry dates without accessing Azure
        if: ${{ inputs.test_notification != true }}
        shell: pwsh
        run: ./scripts/Test-CredentialExpiry.ps1
      - name: Test failure notification without changing credentials
        if: ${{ inputs.test_notification == true }}
        shell: pwsh
        run: |
          'Intentional credential-alert notification test. No expiry assessment or credential change was performed.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          Write-Host '::warning title=List Hero notification test::Intentional failure to test GitHub Actions notifications.'
          exit 1
